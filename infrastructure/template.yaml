  AssignModeratorResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Mutation, FieldName: assignModerator, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
  InviteUserResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Mutation, FieldName: inviteUser, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
  RemoveBoardMemberResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Mutation, FieldName: removeBoardMember, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
  GetOrganizationSettingsResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Query, FieldName: getOrganizationSettings, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
  UpdateOrganizationSettingsResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Mutation, FieldName: updateOrganizationSettings, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
  GetMySettingsResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Query, FieldName: getMySettings, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
  UpdateMySettingsResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Mutation, FieldName: updateMySettings, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub askboard-web-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }

  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: { Name: !Sub 'askboard-${Environment}', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOac.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues: { QueryString: false, Cookies: { Forward: none } }
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } }

  DomainIPv4Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  DomainIPv6Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget: { BudgetName: !Sub 'askboard-${Environment}', BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }, TimeUnit: MONTHLY, BudgetType: COST }

Outputs:
  AppSyncEndpoint: { Value: !GetAtt AppSyncApi.GraphQLUrl }
  AppSyncApiId: { Value: !GetAtt AppSyncApi.ApiId }
  AppSyncApiKey: { Value: !GetAtt AppSyncApiKey.ApiKey }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  WebBucketName: { Value: !Ref WebBucket }
  DistributionId: { Value: !Ref Distribution }
  CloudFrontUrl: { Value: !Sub 'https://${Distribution.DomainName}' }
  ApplicationUrl: { Value: !Sub 'https://${DomainName}' }
  AwsRegion: { Value: !Ref AWS::Region }
  AdminEmail: { Value: !Ref AdminEmail }
