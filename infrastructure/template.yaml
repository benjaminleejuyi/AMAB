  CastVoteResolver: { Type: AWS::AppSync::Resolver, DependsOn: AppSyncSchema, Properties: { ApiId: !GetAtt AppSyncApi.ApiId, TypeName: Mutation, FieldName: castVote, DataSourceName: !GetAtt AppSyncDataSource.Name, RequestMappingTemplate: '{"version":"2018-05-29","operation":"Invoke","payload":$util.toJson($context)}', ResponseMappingTemplate: '#if($context.error) $util.error($context.error.message, $context.error.type) #end $util.toJson($context.result)' } }
